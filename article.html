<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">文章详情 - Polarsky's Blog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <style>
        /* 文章页面专用样式 */
        .article-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .article-header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .article-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .article-meta {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .article-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .article-description {
            font-size: 1.125rem;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        .article-tags {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .article-tag {
            background: var(--surface-color);
            color: var(--primary-color);
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .article-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-primary);
        }

        .article-content h1,
        .article-content h2,
        .article-content h3,
        .article-content h4,
        .article-content h5,
        .article-content h6 {
            margin: 2rem 0 1rem;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .article-content h1 {
            font-size: 2rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .article-content h2 {
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .article-content h3 {
            font-size: 1.25rem;
        }

        .article-content p {
            margin: 1rem 0;
        }

        .article-content ul,
        .article-content ol {
            margin: 1rem 0;
            padding-left: 2rem;
        }

        .article-content li {
            margin: 0.5rem 0;
        }

        .article-content blockquote {
            border-left: 4px solid var(--primary-color);
            margin: 1.5rem 0;
            padding: 1rem 1.5rem;
            background: var(--surface-color);
            border-radius: 0 var(--radius) var(--radius) 0;
            font-style: italic;
        }

        .article-content code {
            background: var(--surface-color);
            color: var(--primary-color);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.9em;
            font-family: 'Monaco', 'Menlo', monospace;
        }

        .article-content pre {
            background: #2d3748;
            color: #e2e8f0;
            padding: 1.5rem;
            border-radius: var(--radius);
            overflow-x: auto;
            margin: 1.5rem 0;
        }

        .article-content pre code {
            background: none;
            color: inherit;
            padding: 0;
        }

        .article-content img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius);
            margin: 1rem 0;
            box-shadow: var(--shadow-md);
        }

        .article-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 0.9rem;
        }

        .article-content th,
        .article-content td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .article-content th {
            background: var(--surface-color);
            font-weight: 600;
            color: var(--text-primary);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 2rem;
            transition: var(--transition);
        }

        .back-button:hover {
            color: var(--primary-dark);
            transform: translateX(-2px);
        }

        .loading-article {
            text-align: center;
            padding: 4rem 2rem;
        }

        .error-article {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .error-article h2 {
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .toc {
            background: var(--surface-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin: 2rem 0;
            border-left: 4px solid var(--primary-color);
        }

        .toc h4 {
            margin: 0 0 1rem 0;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .toc ul {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        .toc li {
            margin: 0.5rem 0;
        }

        .toc a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            transition: var(--transition);
        }

        .toc a:hover {
            color: var(--primary-color);
        }

        @media (max-width: 768px) {
            .article-container {
                padding: 1rem;
            }

            .article-title {
                font-size: 2rem;
            }

            .article-meta {
                gap: 1rem;
            }

            .article-content {
                font-size: 1rem;
            }

            .article-content h1 {
                font-size: 1.5rem;
            }

            .article-content h2 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/5.1.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    
    <!-- 模块化脚本引入 -->
    <script src="js/config.js"></script>
    <script src="js/media-handler.js"></script>
    <script src="js/markdown-renderer.js"></script>
    <script src="js/article-loader.js"></script>
    
    <script>
        // 立即检查模块加载状态（在脚本加载后立即执行）
        console.log('📋 检查模块加载状态...');
        console.log('PathConfig:', typeof window.PathConfig);
        console.log('MarkdownRenderer:', typeof window.MarkdownRenderer);
        console.log('MediaHandler:', typeof window.MediaHandler);
        console.log('APP_CONFIG:', typeof window.APP_CONFIG);
        
        // 启用调试标志，以便在发生问题时记录
        window.DEBUG_MODULES = true;
        
        // 等待所有模块加载完毕（使用 DOMContentLoaded）
        document.addEventListener('DOMContentLoaded', () => {
            // 最后一次验证模块是否已加载
            const requiredModules = ['PathConfig', 'MarkdownRenderer', 'MediaHandler', 'APP_CONFIG'];
            const missingModules = requiredModules.filter(m => typeof window[m] === 'undefined');
            
            console.log('📋 DOMContentLoaded 时模块检查:');
            requiredModules.forEach(m => {
                console.log(`  - ${m}: ${typeof window[m]}`);
            });
            
            if (missingModules.length > 0) {
                console.error('❌ 缺失的模块:', missingModules);
                showError(`模块加载失败: ${missingModules.join(', ')}`);
                return;
            }
            
            console.log('✓ 所有 4 个模块已成功加载');
        });
        
        // 也在 window load 事件时检查（备用方案）
        window.addEventListener('load', () => {
            const requiredModules = ['PathConfig', 'MarkdownRenderer', 'MediaHandler', 'APP_CONFIG'];
            const missingModules = requiredModules.filter(m => typeof window[m] === 'undefined');
            
            if (missingModules.length > 0 && window.DEBUG_MODULES) {
                console.warn('⚠ Load 事件时仍有缺失的模块:', missingModules);
            }
        });

        // 获取正确的首页链接
        function getHomePageUrl() {
            return PathConfig.getHtmlPath('index.html');
        }

        // 获取正确的posts路径
        function getPostsPath(filename) {
            return PathConfig.getPostsPath(filename);
        }

        // 页面初始化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('页面初始化开始...');
            
            // 验证模块加载（带超时）
            setTimeout(() => {
                if (typeof PathConfig === 'undefined') {
                    showError('配置模块加载失败 (PathConfig)');
                    console.error('PathConfig 未定义');
                    return;
                }
                
                // 更新所有返回首页的链接
                const backButtons = document.querySelectorAll('a[href="index.html"]');
                const homeUrl = getHomePageUrl();
                backButtons.forEach(button => {
                    button.href = homeUrl;
                });
                
                // 加载文章
                loadArticle();
            }, 100);
        });

        async function loadArticle() {
            // 首先验证所有必要的模块已加载
            const requiredModules = {
                'PathConfig': typeof window.PathConfig,
                'MarkdownRenderer': typeof window.MarkdownRenderer,
                'MediaHandler': typeof window.MediaHandler,
                'APP_CONFIG': typeof window.APP_CONFIG
            };

            console.log('🔍 loadArticle() 开始: 验证模块加载状态');
            Object.entries(requiredModules).forEach(([name, type]) => {
                console.log(`  ${name}: ${type}`);
            });

            const missingModules = Object.entries(requiredModules)
                .filter(([_, type]) => type === 'undefined')
                .map(([name, _]) => name);

            if (missingModules.length > 0) {
                showError(`模块加载失败: ${missingModules.join(', ')}\n\n请访问 script-diagnostics.html 进行诊断`);
                console.error('❌ 缺失的模块:', missingModules);
                return;
            }

            console.log('✓ 所有模块已加载');

            const urlParams = new URLSearchParams(window.location.search);
            const filename = urlParams.get('file');
            const downloadUrl = urlParams.get('download_url');

            if (!filename) {
                showError('未指定文章文件名');
                return;
            }

            // 检测file://协议
            if (window.location.protocol === 'file:') {
                showError('请使用HTTP服务器访问此页面。请在命令行中运行：python -m http.server 8000，然后访问 http://localhost:8000');
                return;
            }

            console.log('正在加载文章:', filename);
            console.log('下载链接:', downloadUrl || '使用本地路径');
            console.log('当前环境信息:', {
                protocol: window.location.protocol,
                hostname: window.location.hostname,
                pathname: window.location.pathname,
                basePath: PathConfig ? PathConfig.getBasePath() : 'undefined'
            });

            try {
                let content = '';
                let response;
                
                if (downloadUrl) {
                    // 优先通过download_url加载（GitHub raw文件）
                    console.log('尝试从GitHub加载:', downloadUrl);
                    response = await fetch(downloadUrl);
                    if (!response.ok) {
                        console.warn('GitHub加载失败，尝试本地路径');
                        throw new Error(`GitHub响应失败: ${response.status}`);
                    }
                    content = await response.text();
                } else {
                    // 本地加载 - 处理GitHub Pages路径
                    const postsPath = getPostsPath(filename);
                    console.log('从本地路径加载:', postsPath);
                    response = await fetch(postsPath);
                    if (!response.ok) {
                        throw new Error(`本地文件不存在 (${response.status}): ${postsPath}`);
                    }
                    content = await response.text();
                }
                
                console.log('文章内容长度:', content.length);
                
                if (!content.trim()) {
                    throw new Error('文章内容为空');
                }
                
                const article = parseMarkdownFile(content, filename);
                console.log('解析后的文章:', article);
                displayArticle(article);
                
            } catch (error) {
                console.error('加载文章失败:', error);
                showError(`加载失败: ${error.message}`);
            }
        }

        function normalizeFrontMatterValue(value) {
            return String(value).replace(/^['"]|['"]$/g, '').trim();
        }

        function parseTagsValue(rawValue) {
            const value = String(rawValue).trim();
            if (!value) return [];
            if (value.startsWith('[') && value.endsWith(']')) {
                try {
                    const parsed = JSON.parse(value);
                    return Array.isArray(parsed) ? parsed.map(normalizeFrontMatterValue) : [];
                } catch (error) {
                    const inner = value.slice(1, -1);
                    return inner.split(',').map(normalizeFrontMatterValue).filter(Boolean);
                }
            }
            if (value.includes(',')) {
                return value.split(',').map(normalizeFrontMatterValue).filter(Boolean);
            }
            return [normalizeFrontMatterValue(value)];
        }

        function parseFrontMatter(content) {
            const lines = content.split('\n');
            let frontMatterEnd = -1;
            const frontMatter = {};
            let currentListKey = null;

            if (lines[0] && lines[0].trim() === '---') {
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i];
                    if (line.trim() === '---') {
                        frontMatterEnd = i;
                        break;
                    }

                    const match = line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);
                    if (match) {
                        const [, key, rawValue] = match;
                        const value = (rawValue || '').trim();
                        if (!value) {
                            currentListKey = key;
                            if (!Array.isArray(frontMatter[key])) {
                                frontMatter[key] = [];
                            }
                            continue;
                        }

                        currentListKey = null;
                        if (key === 'tags') {
                            frontMatter[key] = parseTagsValue(value);
                        } else {
                            frontMatter[key] = normalizeFrontMatterValue(value);
                        }
                        continue;
                    }

                    const listMatch = line.match(/^\s*-\s+(.+)$/);
                    if (listMatch && currentListKey) {
                        if (!Array.isArray(frontMatter[currentListKey])) {
                            frontMatter[currentListKey] = [];
                        }
                        frontMatter[currentListKey].push(normalizeFrontMatterValue(listMatch[1]));
                    }
                }
            }

            const articleContent = frontMatterEnd >= 0
                ? lines.slice(frontMatterEnd + 1).join('\n')
                : content;

            return {
                frontMatter,
                articleContent: articleContent.trim()
            };
        }

        function parseMarkdownFile(content, filename) {
            // 防御性检查
            if (!content || typeof content !== 'string') {
                console.error('错误: 接收到无效的文章内容', content);
                throw new Error('文章内容无效');
            }
            
            const parsed = parseFrontMatter(content);
            const frontMatter = parsed.frontMatter;
            const articleContent = parsed.articleContent;
            
            // 防止空内容
            if (!articleContent) {
                console.warn('警告: 文章内容为空');
                throw new Error('文章内容为空');
            }
            
            const wordCount = articleContent.replace(/[^\u4e00-\u9fa5\w]/g, '').length;
            const readTime = Math.max(1, Math.ceil(wordCount / 300));

            const article = {
                title: frontMatter.title || '无标题',
                date: frontMatter.date || '未知日期',
                tags: Array.isArray(frontMatter.tags) ? frontMatter.tags : (frontMatter.tags ? [frontMatter.tags] : []),
                description: frontMatter.description || '',
                content: articleContent,
                readTime: readTime
            };
            
            console.log('✓ Front Matter 解析成功:', article);
            return article;
        }

        function displayArticle(article) {
            try {
                // 防御性检查
                if (!article || typeof article !== 'object') {
                    throw new Error('无效的文章对象');
                }

                // 更新页面标题
                document.title = `${article.title} - Polarsky's Blog`;
                document.getElementById('page-title').textContent = `${article.title} - Polarsky's Blog`;

                // 填充文章信息
                document.getElementById('article-title').textContent = article.title || '无标题';
                
                const metaHTML = `
                    <div class="article-meta-item">
                        📅 ${formatDate(article.date)}
                    </div>
                    <div class="article-meta-item">
                        ⏱️ ${article.readTime} 分钟阅读
                    </div>
                `;
                document.getElementById('article-meta').innerHTML = metaHTML;

                if (article.description) {
                    document.getElementById('article-description').textContent = article.description;
                } else {
                    document.getElementById('article-description').style.display = 'none';
                }

                if (article.tags && article.tags.length > 0) {
                    const tagsHTML = article.tags.map(tag => 
                        `<span class="article-tag"># ${escapeHtml(String(tag))}</span>`
                    ).join('');
                    document.getElementById('article-tags').innerHTML = tagsHTML;
                } else {
                    document.getElementById('article-tags').style.display = 'none';
                }

                try {
                    // 配置 Markdown 渲染器（支持视频）
                    if (typeof MarkdownRenderer !== 'undefined' && MarkdownRenderer.configure) {
                        MarkdownRenderer.configure();
                        console.log('✓ Markdown 渲染器已配置');
                    } else {
                        console.warn('⚠ Markdown 渲染器未加载，使用 marked.js 默认配置');
                    }

                    // 确保内容有效
                    if (!article.content || typeof article.content !== 'string') {
                        throw new Error('文章内容无效');
                    }

                    // 渲染 Markdown 内容（支持视频）
                    let htmlContent;
                    if (typeof MarkdownRenderer !== 'undefined' && MarkdownRenderer.parse) {
                        htmlContent = MarkdownRenderer.parse(article.content);
                        console.log('✓ 使用 MarkdownRenderer 渲染');
                    } else if (typeof marked !== 'undefined') {
                        htmlContent = marked.parse(article.content);
                        console.log('✓ 使用 marked 默认渲染');
                    } else {
                        throw new Error('没有可用的 Markdown 渲染器');
                    }
                    
                    if (!htmlContent || typeof htmlContent !== 'string') {
                        throw new Error('Markdown 渲染返回无效内容');
                    }
                    
                    document.getElementById('article-content').innerHTML = htmlContent;

                    // 获取文章内容容器
                    const contentContainer = document.getElementById('article-content');

                    // 处理图片
                    if (typeof MediaHandler !== 'undefined' && MediaHandler.processImages) {
                        MediaHandler.processImages(contentContainer);
                        console.log('✓ 图片已处理');
                    } else {
                        console.warn('⚠ 媒体处理器未加载');
                    }

                    // 处理视频
                    if (typeof MediaHandler !== 'undefined' && MediaHandler.processVideos) {
                        MediaHandler.processVideos(contentContainer);
                        console.log('✓ 视频已处理');
                    } else {
                        console.warn('⚠ 视频处理失败');
                    }

                    // 生成目录
                    generateTOC();

                    // 代码高亮
                    if (typeof Prism !== 'undefined') {
                        Prism.highlightAll();
                        console.log('✓ 代码已高亮');
                    }

                    // 显示文章，隐藏加载状态
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('article').classList.remove('hidden');
                    console.log('✓ 文章加载完成');
                    
                } catch (renderError) {
                    console.error('渲染文章失败:', renderError);
                    throw renderError;
                }
                
            } catch (error) {
                console.error('显示文章失败:', error);
                showError(`渲染文章失败: ${error.message}`);
            }
        }

        function generateTOC() {
            const headings = document.querySelectorAll('#article-content h1, #article-content h2, #article-content h3');
            if (headings.length === 0) return;

            const tocList = document.getElementById('toc-list');
            const tocContainer = document.getElementById('toc');

            headings.forEach((heading, index) => {
                const id = `heading-${index}`;
                heading.id = id;

                const li = document.createElement('li');
                li.style.marginLeft = `${(parseInt(heading.tagName.charAt(1)) - 1) * 1}rem`;
                
                const a = document.createElement('a');
                a.href = `#${id}`;
                a.textContent = heading.textContent;
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    heading.scrollIntoView({ behavior: 'smooth' });
                });

                li.appendChild(a);
                tocList.appendChild(li);
            });

            tocContainer.classList.remove('hidden');
        }

        function showError(message = '文章加载失败') {
            document.getElementById('loading').classList.add('hidden');
            const errorElement = document.getElementById('error');
            
            // 获取正确的首页链接
            const homeUrl = getHomePageUrl();
            
            // 更新错误消息
            const errorContent = `
                <h2>😕 ${message}</h2>
                <p>抱歉，无法加载您要查看的文章。</p>
                <p><small>错误详情：${message}</small></p>
                <a href="${homeUrl}" class="back-button">返回首页</a>
                <button onclick="location.reload()" class="back-button" style="margin-left: 1rem;">重试</button>
            `;
            errorElement.innerHTML = errorContent;
            errorElement.classList.remove('hidden');
        }

        function formatDate(dateString) {
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } catch (error) {
                return dateString;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
